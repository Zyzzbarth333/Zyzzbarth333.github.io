:root {

* { box-sizing: border-box; }

.brand { font: 700 0.95rem/1 var(--sans); letter-spacing: 2.5px; margin-right: 6px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgb(0 0 0 / 0.35);

.pill[data-s="warn"] i { background: var(--amber); }

.phases { display: flex; gap: 4px; padding: 10px 14px 0; }

.phases li.past { color: var(--text2); background: #262626; }
.phases li.now { color: #000; background: var(--aqua); }
.phases { margin: 0; }
.main { display: grid; grid-template-columns: 1fr 230px; gap: 12px; padding: 12px 14px; }
.chart { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 6px; min-width: 0; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; font: 0.72rem/1.2 var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.chart-head b { color: var(--text); font-size: 0.95rem; letter-spacing: 0.5px; }
.chart svg { display: block; width: 100%; height: auto; margin-top: 6px; }
.grid line { stroke: #2a2a2a; stroke-width: 1; }
.axis text { fill: var(--text3); font: 10px var(--mono); }
.callout { stroke: #555; stroke-dasharray: 5 4; }
.callout-t { fill: var(--text2); font: 10px var(--mono); }
.trace { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
.ghost { fill: none; stroke: #2f2f2f; stroke-width: 2; }
.ev line { stroke: #666; }
.ev text { fill: var(--text2); font: 10px var(--mono); }
.now-dot { fill: var(--aqua); }
.side { display: grid; gap: 8px; align-content: start; }
.ro { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.ro span { display: block; font: 0.7rem/1 var(--mono); color: var(--text2); letter-spacing: 1px; text-transform: uppercase; }
.ro b { display: block; font: 700 1.15rem/1.3 var(--mono); }
.ro b small { font-size: 0.7rem; color: var(--text2); font-weight: 400; margin-left: 4px; }
.log { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: 0.8rem/1.55 var(--mono); color: var(--text2); min-height: 92px; }
.log div b { color: var(--text); font-weight: 700; }
.log .h { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
.controls { display: flex; align-items: center; gap: 10px; padding: 0 14px 12px; }
.controls button { font: 700 0.7rem/1 var(--mono); letter-spacing: 0.8px; text-transform: uppercase; color: var(--text); background: var(--bg3);
                   border: 1px solid var(--line2); border-radius: 4px; padding: 7px 10px; cursor: pointer; }
.controls button.on { background: var(--aqua); color: #000; border-color: var(--aqua); }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.controls input { flex: 1; accent-color: var(--aqua); height: 28px; margin: 0; cursor: pointer; }   /* a taller hit area for touch; the track stays thin */
.note { padding: 0 14px 10px; font: 0.8rem/1.4 var(--mono); color: var(--text3); }
@media (max-width: 620px) { .main { grid-template-columns: 1fr; } .side { grid-template-columns: 1fr 1fr; } .log { grid-column: 1 / -1; } .clock { margin-left: 0; } }
</style>
