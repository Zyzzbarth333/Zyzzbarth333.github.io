<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theseus V arena map</title>
<!-- Generated by portfolio/figures/theseus/build_map.py from the rover's FAST-LIO2 arena map and the run's keyposes. -->
<style>
@font-face { font-family: "Sanchez"; src: url("../fonts/sanchez-400-latin.woff2") format("woff2"); font-display: swap; }
:root { --ink: #2E1499; --muted: #5E4FA8; --grid: #ECE9F6; --path: #E8590C; --surface: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 "Sanchez", Georgia, serif; }
.wrap { padding: 14px 16px 12px; display: grid; gap: 8px; }
svg { display: block; width: 100%; height: auto; }
.edge { fill: none; stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.path { fill: none; stroke: var(--path); stroke-width: 2.5px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ring { fill: var(--surface); stroke: var(--path); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.end { fill: var(--path); stroke: var(--surface); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.cube { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.lab { fill: var(--ink); font-size: 0.78px; paint-order: stroke; stroke: rgb(255 255 255 / 0.9); stroke-width: 0.22px; stroke-linejoin: round; }
.muted { fill: var(--muted); }
.bar { stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
details { font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
table { border-collapse: collapse; margin-top: 6px; }
th, td { text-align: left; padding: 3px 16px 3px 0; border-bottom: 1px solid var(--grid); font-weight: 400; font-variant-numeric: tabular-nums; }
th { color: var(--muted); }
@media (max-width: 520px) { .wrap { padding: 10px; } .lab { font-size: 1.25px; stroke-width: 0.3px; } }
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 34.50 29.40" role="img" aria-label="Top-down LiDAR map of the 30.5 by 25.4 m arena, with the rover's autonomous path from start to end and the two cubes it detected">
    <image href="theseus-map-cloud.webp?v=eefe23f5" x="0" y="0" width="34.50" height="29.40" preserveAspectRatio="none"/>
    <rect class="edge" x="2.00" y="2.00" width="30.5" height="25.4"><title>Arena edge, 30.5 by 25.4 m</title></rect>
    <text class="lab muted" x="2.40" y="3.10">Arena edge</text>
    <path class="path" d="M18.00 20.38 L17.90 16.35 L13.86 15.83 L11.02 18.85 L7.01 19.05 L4.81 15.73"><title>Autonomous path: straight lines between the run's 6 SLAM keyposes</title></path>
    <circle class="ring" cx="18.00" cy="20.38" r="0.38"><title>Start, arena (16.0, 7.0) m</title></circle>
    <text class="lab" x="18.65" y="21.53">Start</text>
    <rect class="end" x="4.45" y="15.37" width="0.72" height="0.72"><title>End, arena (2.8, 11.7) m</title></rect>
    <text class="lab" x="4.31" y="14.98" text-anchor="end">End</text>
    <g><title>Blue cube detected, arena (12.8, 13.9) m</title><path class="cube" d="M14.80 13.07 L15.22 13.49 L14.80 13.91 L14.38 13.49 Z"/><text class="lab" x="15.50" y="13.79">Blue cube</text></g><g><title>Green cube detected, arena (5.1, 13.3) m</title><path class="cube" d="M7.05 13.63 L7.47 14.05 L7.05 14.47 L6.63 14.05 Z"/><text class="lab" x="7.75" y="14.35">Green cube</text></g>
    <g transform="translate(27.50 28.55)">
      <line class="bar" x1="0" y1="0" x2="5" y2="0"/><line class="bar" x1="0" y1="-0.25" x2="0" y2="0.25"/><line class="bar" x1="5" y1="-0.25" x2="5" y2="0.25"/>
      <text class="lab" x="2.5" y="-0.45" text-anchor="middle">5 m</text>
    </g>
  </svg>
  <details><summary>Path and detections as a table</summary>
    <table><thead><tr><th>Point</th><th>x (m)</th><th>y (m)</th></tr></thead><tbody><tr><td>Start</td><td>16.0</td><td>7.0</td></tr><tr><td>1</td><td>15.9</td><td>11.0</td></tr><tr><td>2</td><td>11.9</td><td>11.6</td></tr><tr><td>3</td><td>9.0</td><td>8.5</td></tr><tr><td>4</td><td>5.0</td><td>8.3</td></tr><tr><td>End</td><td>2.8</td><td>11.7</td></tr><tr><td>Blue cube</td><td>12.8</td><td>13.9</td></tr><tr><td>Green cube</td><td>5.1</td><td>13.3</td></tr></tbody></table>
  </details>
</div>
</body>
</html>
