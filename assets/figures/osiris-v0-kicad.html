<style>
@font-face { font-family: "Sanchez"; src: url("../fonts/sanchez-400-latin.woff2") format("woff2"); font-display: swap; }
:root { --ink: #2E1499; --muted: #5E4FA8; --grid: #ECE9F6; --surface: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 "Sanchez", Georgia, serif; }
.wrap { padding: 14px 16px 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; margin: 0; }
button.link { font: inherit; color: var(--ink); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
button.link[aria-pressed="true"] { text-decoration: none; font-weight: 700; }
button.link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 320px; border: 1px solid var(--grid); background: var(--surface); overflow: hidden; }
.stage img { display: block; width: 100%; height: 100%; object-fit: contain; }
kicanvas-embed { display: block; width: 100%; height: 100%; min-width: 0; }
@media (max-width: 520px) { .wrap { padding: 10px; } .stage { aspect-ratio: 4 / 5; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="bar">
    <button class="link" type="button" data-show="pcb" aria-pressed="false">Open the board</button>
    <button class="link" type="button" data-show="sch" aria-pressed="false">Open the schematic</button>
    <span class="note">The real KiCad files, drawn by KiCanvas. They load (about 2.2 MB) only when you open one.</span>
  </p>
  <div class="stage" id="stage" aria-live="polite">
    <img src="../img/projects/osiris-v0-top.jpg" alt="Top view of the OSIRIS V0 board, before the KiCad viewer is opened">
  </div>
</div>
<script>
(function () {
  var DIR = '../kicad/osiris-v0/';
  var FILES = { pcb: ['osiris-v0.kicad_pro', 'osiris-v0.kicad_pcb'], sch: ['osiris-v0.kicad_pro'].concat(['osiris-v0.kicad_sch', 'mcu.kicad_sch', 'power.kicad_sch', 'sensors.kicad_sch', 'storage_io.kicad_sch', 'diagnostics.kicad_sch']) };
  var stage = document.getElementById('stage');
  var buttons = [].slice.call(document.querySelectorAll('[data-show]'));
  var loading = null;
  function load() {
    if (!loading) loading = new Promise(function (ok, fail) {
      var s = document.createElement('script');
      s.type = 'module'; s.src = '../vendor/kicanvas/kicanvas.js';
      s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
    return loading;
  }
  function show(which) {
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.show === which)); });
    var wait = document.createElement('p'); wait.className = 'note'; wait.style.padding = '12px';
    wait.textContent = 'Loading the KiCad viewer…';
    stage.replaceChildren(wait);
    load().then(function () {
      var e = document.createElement('kicanvas-embed');
      e.setAttribute('controls', window.innerWidth < 700 ? 'basic' : 'full');   // the full sidebar needs about 650 px
      e.setAttribute('aria-label', which === 'pcb' ? 'OSIRIS V0 board in KiCanvas' : 'OSIRIS V0 schematic in KiCanvas');
      FILES[which].forEach(function (f) {
        var s = document.createElement('kicanvas-source'); s.setAttribute('src', DIR + f); e.appendChild(s);
      });
      stage.replaceChildren(e);
    }).catch(function () {
      wait.textContent = 'The viewer could not load. The KiCad files are in assets/kicad/osiris-v0/.';
    });
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.show); }); });
})();
</script>
</body>
