<style>
@font-face { font-family: "Sanchez"; src: url("../fonts/sanchez-400-latin.woff2") format("woff2"); font-display: swap; }
:root { --ink: #2E1499; --muted: #5E4FA8; --grid: #ECE9F6; --band: #F4F2FA; --asc: #4F37C8; --dsc: #E8590C; --surface: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 "Sanchez", Georgia, serif; }
.fig { display: grid; grid-template-columns: 1.35fr 1fr; gap: 6px 28px; padding: 14px 16px 10px; }
.cell h3 { margin: 0 0 2px; font: 400 0.95rem/1.3 "Sanchez", Georgia, serif; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid line { stroke: var(--grid); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-title { fill: var(--muted); font-size: 11px; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.asc { stroke: var(--asc); } .dsc { stroke: var(--dsc); }
.model { stroke-dasharray: 5 4; }
.band { fill: var(--band); }
.note { fill: var(--ink); font-size: 11.5px; }
.note.muted { fill: var(--muted); }
.lead { stroke: var(--muted); stroke-width: 1; }
.mk { stroke: var(--surface); stroke-width: 2; }
.cursor { stroke: var(--ink); stroke-width: 1; }
.tip { font-size: 11.5px; }
.tip rect { fill: var(--surface); stroke: var(--grid); }
.hit { fill: transparent; cursor: crosshair; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 12.5px; color: var(--muted); margin: 0; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key svg { width: 26px; height: 8px; display: inline-block; }
button.link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
button.link:focus-visible, svg:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
details { grid-column: 1 / -1; font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--grid); font-weight: 400; }
th { color: var(--muted); }
@media (max-width: 640px) { .fig { grid-template-columns: 1fr; } .tick, .axis-title { font-size: 15px; } .note, .tip { font-size: 15.5px; } }
</style>
</head>

[0, 200, 400, 600].forEach((a) => { el("line", { x1: L, x2: AW - R, y1: ay(a), y2: ay(a) }, g); txt(A, L - 6, ay(a) + 4, a === 600 ? "600 m" : a, "tick", "end"); });
for (let t = 0; t <= T1; t += 10) txt(A, ax(t), AH - B + 16, t, "tick", "middle");
txt(A, L, AH - 2, "seconds after liftoff", "axis-title", "start");
el("rect", { class: "band", x: ax(E.brownout), y: T, width: ax(E.resume) - ax(E.brownout), height: AH - T - B }, A);
txt(A, (ax(E.brownout) + ax(E.resume)) / 2, ay(80), "brownout:", "note muted", "middle");
txt(A, (ax(E.brownout) + ax(E.resume)) / 2, ay(80) + 14, "no log ~9 s", "note muted", "middle");
const pts = (s) => s.map(([t, a]) => `${ax(t).toFixed(1)},${ay(Math.max(0, a)).toFixed(1)}`).join(" ");
el("polyline", { class: "ln asc", points: pts(D.asc) }, A);
el("polyline", { class: "ln dsc", points: pts(D.dsc) }, A);
// selective direct labels: burnout, apogee, the brownout, landing
const altAtAsc = (t) => { const s = D.asc; for (let i = 1; i < s.length; i++) if (s[i][0] >= t) return s[i - 1][1] + (s[i][1] - s[i - 1][1]) * (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]); return s[s.length - 1][1]; };
el("circle", { class: "mk", cx: ax(E.apogee_t), cy: ay(E.apogee_m), r: 4.5, fill: "#4F37C8" }, A);
txt(A, ax(E.apogee_t) + 9, ay(E.apogee_m) + 4, `apogee ${apo} m, T+${E.apogee_t.toFixed(1)} s`);
const bx = ax(E.burnout), by = ay(altAtAsc(E.burnout));
el("line", { class: "lead", x1: bx + 3, y1: by, x2: bx + 26, y2: by }, A);
txt(A, bx + 29, by + 4, `burnout, T+${E.burnout.toFixed(1)} s`);
const lastD = D.dsc[D.dsc.length - 1];
txt(A, ax(lastD[0]), ay(lastD[1]) + 16, `landed, T+${Math.round(E.land)} s`, "note", "end");

// ---------- ground track (equal scale, north up) ----------
const K = document.getElementById("trk"), KW = 330, KH = 250, pad = 22;
const xs = D.path.map((p) => p[0]), ys = D.path.map((p) => p[1]);
const xmin = Math.min(0, ...xs), xmax = Math.max(...xs), ymin = Math.min(...ys), ymax = Math.max(0, ...ys);
const sc = Math.min((KW - 2 * pad) / (xmax - xmin), (KH - 2 * pad - 14) / (ymax - ymin));
const kx = (x) => pad + (x - xmin) * sc, ky = (y) => pad + (ymax - y) * sc;
const kg = el("g", { class: "grid" }, K);
for (let v = Math.ceil(xmin / 100) * 100; v <= xmax; v += 100) el("line", { x1: kx(v), x2: kx(v), y1: ky(ymax), y2: ky(ymin) }, kg);
for (let v = Math.ceil(ymin / 100) * 100; v <= ymax; v += 100) el("line", { x1: kx(xmin), x2: kx(xmax), y1: ky(v), y2: ky(v) }, kg);
const segs = []; let cur = [];
D.path.forEach((p, i) => { if (i && p[3] !== D.path[i - 1][3]) { segs.push(cur); cur = [D.path[i - 1]]; } cur.push(p); }); segs.push(cur);
const segClass = { ascent: "ln asc", gap_predicted: "ln asc model", descent_gps: "ln dsc", descent_horizontal_unknown: "ln dsc model" };
segs.forEach((s) => el("polyline", { class: segClass[s[s.length - 1][3]], points: s.map((p) => `${kx(p[0]).toFixed(1)},${ky(p[1]).toFixed(1)}`).join(" ") }, K));
el("circle", { cx: kx(0), cy: ky(0), r: 4.5, fill: "none", stroke: "#2E1499", "stroke-width": 1.5 }, K);
txt(K, kx(0) - 8, ky(0) + 4, "pad", "note", "end");
const land = D.path[D.path.length - 1];
txt(K, kx(land[0]) + 12, ky(land[1]) + 4, "landing", "note", "start");
const bar = 100 * sc; el("line", { x1: KW - pad - bar, x2: KW - pad, y1: KH - 8, y2: KH - 8, stroke: "#5E4FA8", "stroke-width": 1.5 }, K);
txt(K, KW - pad - bar / 2, KH - 13, "100 m", "tick", "middle");
txt(K, KW - pad, pad - 6, "north ↑", "tick", "end");

// ---------- acceleration, first 4 s ----------
const C = document.getElementById("acc"), CW = 520, CH = 120, CB = 26;
const cx = (t) => L + (t + 0.5) / 4.5 * (CW - L - R), cy = (gv) => 8 + (1 - gv / 12) * (CH - 8 - CB);
const cg = el("g", { class: "grid" }, C);
[0, 6, 12].forEach((v) => { el("line", { x1: L, x2: CW - R, y1: cy(v), y2: cy(v) }, cg); txt(C, L - 6, cy(v) + 4, v === 12 ? "12 g" : v, "tick", "end"); });
[0, 1, 2, 3, 4].forEach((t) => txt(C, cx(t), CH - CB + 16, t, "tick", "middle"));
el("polyline", { class: "ln asc", points: D.imu.filter(([t]) => t >= -0.5).map(([t, v]) => `${cx(t).toFixed(1)},${cy(Math.min(12.5, v)).toFixed(1)}`).join(" ") }, C);
const pk = D.imu.reduce((b, p) => (p[1] > b[1] ? p : b));
el("line", { class: "lead", x1: cx(pk[0]) + 4, y1: cy(pk[1]) - 2, x2: cx(1.55), y2: cy(pk[1]) - 2 }, C);
txt(C, cx(1.55) + 4, cy(pk[1]) + 2, `peak ${E.peak_g} g`);

// ---------- table view ----------
const tb = document.querySelector("#tbl tbody");
[[0, 0, "liftoff"], [E.burnout, altAtAsc(E.burnout), "burnout"], [E.apogee_t, E.apogee_m, `apogee (flight card: ${apo} m)`], [E.brownout, D.asc[D.asc.length - 1][1], "ejection brownout; logging stops"],
 [E.resume, D.dsc[0][1], "logging resumes (descent clock aligned, approximate)"], [E.land, lastD[1], "landed"]].forEach(([t, a, s]) => {
  const tr = document.createElement("tr"); tr.innerHTML = `<td>T+${t.toFixed(1)} s</td><td>${Math.round(a)} m</td><td>${s}</td>`; tb.appendChild(tr);
});

// ---------- linked cursor: hover, arrow keys, or replay ----------
const altAt = (t) => {
  const s = t <= E.brownout ? D.asc : t >= E.resume ? D.dsc : null;
  if (!s) return null;
  if (t <= s[0][0]) return s[0][1];
  for (let i = 1; i < s.length; i++) if (s[i][0] >= t) return s[i - 1][1] + (s[i][1] - s[i - 1][1]) * (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
  return s[s.length - 1][1];
};
const posAt = (t) => { const ps = D.path; if (t <= ps[0][4]) return ps[0]; for (let i = 1; i < ps.length; i++) if (ps[i][4] >= t) { const a = ps[i - 1], b = ps[i], k = (t - a[4]) / Math.max(1e-6, b[4] - a[4]); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; } return ps[ps.length - 1]; };
const phase = (t) => t < 0 ? "on the pad" : t < E.burnout ? "boost" : t < E.apogee_t - 0.3 ? "coast" : t < E.apogee_t + 0.6 ? "apogee" : t < E.brownout ? "falling" : t < E.resume ? "board rebooting" : t < E.land ? "falling" : "landed";
const cl = el("line", { class: "cursor", y1: T, y2: AH - B, visibility: "hidden" }, A);
const cd = el("circle", { class: "mk", r: 4.5, fill: "#2E1499", visibility: "hidden" }, A);
const tipG = el("g", { class: "tip", visibility: "hidden" }, A), tipR = el("rect", { rx: 3, height: 20 }, tipG), tipT = el("text", { class: "note", y: 14 }, tipG);
const kd = el("circle", { class: "mk", r: 5, fill: "#2E1499", visibility: "hidden" }, K);
const ccur = el("line", { class: "cursor", y1: 8, y2: CH - CB, visibility: "hidden" }, C);
let tNow = null, playing = false;
function show(t) {
  tNow = t; const on = t !== null, vis = on ? "visible" : "hidden";
  [cl, tipG, kd].forEach((n) => n.setAttribute("visibility", vis));
  ccur.setAttribute("visibility", on && t <= 4 ? "visible" : "hidden");
  if (!on) { cd.setAttribute("visibility", "hidden"); return; }
  const x = ax(t), a = altAt(t);
  cl.setAttribute("x1", x); cl.setAttribute("x2", x);
  cd.setAttribute("visibility", a === null ? "hidden" : "visible");
  if (a !== null) { cd.setAttribute("cx", x); cd.setAttribute("cy", ay(Math.max(0, a))); }
  tipT.textContent = `T${t < 0 ? "−" : "+"}${Math.abs(t).toFixed(1)} s · ${a === null ? "not logged" : Math.round(Math.max(0, a)) + " m"} · ${phase(t)}`;
  const w = tipT.getComputedTextLength() + 14, tx = Math.min(AW - R - w, Math.max(L, x + 8));
  tipR.setAttribute("width", w); tipT.setAttribute("x", 7); tipG.setAttribute("transform", `translate(${tx} ${T + 2})`);
  const p = posAt(t); kd.setAttribute("cx", kx(p[0])); kd.setAttribute("cy", ky(p[1]));
  ccur.setAttribute("x1", cx(t)); ccur.setAttribute("x2", cx(t));
}
const hit = el("rect", { class: "hit", x: L, y: T, width: AW - L - R, height: AH - T - B }, A);
const toT = (ev) => { const r = A.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * AW; return Math.max(T0, Math.min(T1, T0 + (x - L) / (AW - L - R) * (T1 - T0))); };
hit.addEventListener("pointermove", (ev) => show(toT(ev)));
hit.addEventListener("pointerleave", () => { if (!playing) show(null); });
A.addEventListener("keydown", (ev) => { const d = { ArrowRight: 0.5, ArrowLeft: -0.5 }[ev.key]; if (!d) return; ev.preventDefault(); show(Math.max(T0, Math.min(T1, (tNow ?? 0) + d))); });
A.addEventListener("blur", () => show(null));
document.getElementById("replay").addEventListener("click", () => {
  if (still) { show(E.apogee_t); return; }
  playing = true; let t = T0, last = 0;
  const step = (now) => { const dt = last ? (now - last) / 1000 : 0; last = now; t += dt * 4; show(Math.min(t, T1)); if (t < T1) requestAnimationFrame(step); else { playing = false; setTimeout(() => show(null), 1200); } };
  requestAnimationFrame(step);
});
</script>
</body>
