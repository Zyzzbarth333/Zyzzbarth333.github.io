20.7L304.7 220.8L303.7 220.7Z"/></g></g></svg></div></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

const RADIANS = Math.PI / 180;

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
