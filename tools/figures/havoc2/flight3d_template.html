<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAVOC-2 first flight in 3D</title>
<!-- Generated by portfolio/figures/havoc2/build_flight.py from the cleaned flight data (positions relative to the pad only).
     Same rules as the 2D figure: solid = measured, dashed = modelled, ink for the ascent, orange for the descent, true scale
     (no vertical exaggeration). three.js (MIT License, Copyright 2010-2023 three.js authors), loaded from jsDelivr at a pinned version. -->
<style>
@font-face { font-family: "Sanchez"; src: url("../fonts/sanchez-400-latin.woff2") format("woff2"); font-display: swap; }
:root { --ink: #2E1499; --muted: #5E4FA8; --grid: #ECE9F6; --asc: #4F37C8; --dsc: #E8590C; --surface: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 "Sanchez", Georgia, serif; }
.wrap { padding: 14px 16px 12px; display: grid; gap: 8px; }
.stage { position: relative; aspect-ratio: 5 / 4; max-width: 100%; overflow: hidden; cursor: grab; touch-action: pan-y; outline: none; }
.stage:active { cursor: grabbing; }
.stage:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
.stage canvas { display: block; width: 100%; height: 100%; }
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; line-height: 1; pointer-events: none;
       text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; will-change: transform; }
.lab.tick { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.lab[hidden] { display: none; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 12.5px; color: var(--muted); margin: 0; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key svg { width: 26px; height: 8px; }
button.link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
button.link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.readout { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 15em; }
.fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; font-size: 14px; }
.nogl .fallback { display: grid; }
/* no WebGL: the stage shrinks to the note, and the key and replay go, since there is nothing to read them against */
.stage.nogl { aspect-ratio: auto; cursor: default; }
.nogl canvas { display: none; }
.stage.nogl .fallback { position: static; display: block; text-align: left; padding: 4px 0; }
body.nogl .foot { display: none; }
@media (max-width: 520px) { .wrap { padding: 10px; } .lab { font-size: 11px; } .lab.tick { font-size: 10px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three-0.187.0/three.module.min.js",
  "three/addons/": "../vendor/three-0.187.0/addons/"
} }
</script>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="3D view" aria-label="Three-dimensional path of HAVOC-2's first flight relative to the pad, at true scale: straight up to about 540 m, then a drift south-east to land about 230 m east and 200 m south of the pad. Drag, or use the arrow keys, to turn it.">
    <canvas id="c"></canvas>
    <div class="fallback">Your browser can't draw the 3D view. The plots above show the same flight.</div>
  </div>
  <p class="foot">
    <span class="key"><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#4F37C8" stroke-width="2.5"/></svg>ascent</span>
    <span class="key"><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#E8590C" stroke-width="2.5"/></svg>descent</span>
    <span class="key"><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#5E4FA8" stroke-width="2" stroke-dasharray="5 4"/></svg>modelled, not measured</span>
    <span>grid squares 50 m</span>
    <button class="link" id="replay" type="button">Replay the flight</button>
    <span class="readout" id="ro" aria-live="off"></span>
  </p>
</div>
<script type="module">
// Load three.js only when the figure comes near the screen: the browser loads lazy frames long before they are seen,
// and setting up WebGL while the page itself is still loading holds up everything else.
await new Promise((resolve) => {
  if (!("IntersectionObserver" in window)) return resolve();
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); resolve(); } }, { rootMargin: "300px 0px" });
  io.observe(document.body);
});
const THREE = await import("three");
const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
const { Line2 } = await import("three/addons/lines/Line2.js");
const { LineMaterial } = await import("three/addons/lines/LineMaterial.js");
const { LineGeometry } = await import("three/addons/lines/LineGeometry.js");

const D = __DATA__;
const E = D.events, P = D.path;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage"), canvas = document.getElementById("c"), ro = document.getElementById("ro");

// world: x east, y up (the flight card's AGL reference), z south (three.js is right-handed with y up)
const ground = P[0][2];
const V = (p) => new THREE.Vector3(p[0], p[2], -p[1]);

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); } catch (e) { renderer = null; }
if (!renderer) {   // no WebGL: show the note and stop here, quietly
  stage.classList.add("nogl"); document.body.classList.add("nogl");
  ["tabindex", "role", "aria-label"].forEach((a) => stage.removeAttribute(a));
  await new Promise(() => {});
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1.25, 1, 5000);

// ground: a 50 m grid under the whole flight, at the pad's height
const xs = P.map((p) => p[0]), ns = P.map((p) => p[1]);
const g0x = Math.floor((Math.min(...xs) - 60) / 50) * 50, g1x = Math.ceil((Math.max(...xs) + 60) / 50) * 50;
const g0n = Math.floor((Math.min(...ns) - 60) / 50) * 50, g1n = Math.ceil((Math.max(...ns) + 60) / 50) * 50;
const gp = [];
for (let x = g0x; x <= g1x; x += 50) gp.push(x, ground, -g0n, x, ground, -g1n);
for (let n = g0n; n <= g1n; n += 50) gp.push(g0x, ground, -n, g1x, ground, -n);
const gridGeo = new THREE.BufferGeometry(); gridGeo.setAttribute("position", new THREE.Float32BufferAttribute(gp, 3));
scene.add(new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({ color: 0xe2ddf2 })));

// the path, split by meaning, plus its shadow on the ground to read depth by
const mats = [];
const fat = (pts, color, width, dashed) => {
  const g = new LineGeometry(); g.setPositions(pts.flatMap((v) => [v.x, v.y, v.z]));
  const m = new LineMaterial({ color, linewidth: width, dashed, dashSize: 9, gapSize: 7, worldUnits: false });
  mats.push(m);
  const l = new Line2(g, m); l.computeLineDistances(); scene.add(l); return l;
};
const STYLE = { ascent: [0x4f37c8, false], gap_predicted: [0x4f37c8, true], descent_gps: [0xe8590c, false], descent_horizontal_unknown: [0xe8590c, true] };
let run = [];
P.forEach((p, i) => {
  run.push(V(p));
  const nxt = P[i + 1];
  if (!nxt || nxt[3] !== p[3]) {
    if (nxt) run.push(V(nxt));                         // join each segment to the next
    const [c, d] = STYLE[p[3]] || [0x5e4fa8, true];
    fat(run, c, 2.5, d);
    run = [];
  }
});
fat(P.map((p) => new THREE.Vector3(p[0], ground + 0.2, -p[1])), 0xd2cbe9, 1.5, false);

// the pad, an altitude pole with ticks every 100 m, apogee and landing marks
const dot = (v, r, color) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), new THREE.MeshBasicMaterial({ color })); m.position.copy(v); scene.add(m); return m; };
const padRing = new THREE.Mesh(new THREE.RingGeometry(5, 7.5, 40), new THREE.MeshBasicMaterial({ color: 0x2e1499, side: THREE.DoubleSide }));
padRing.rotation.x = -Math.PI / 2; padRing.position.set(0, ground + 0.3, 0); scene.add(padRing);
const top = Math.floor(E.apogee_m / 100) * 100;                 // ticks stop below apogee so its label stays clear
const pole = [0, ground, 0, 0, E.apogee_m + 15, 0];
for (let h = 100; h <= top; h += 100) pole.push(-6, h, 0, 6, h, 0);
const poleGeo = new THREE.BufferGeometry(); poleGeo.setAttribute("position", new THREE.Float32BufferAttribute(pole, 3));
scene.add(new THREE.LineSegments(poleGeo, new THREE.LineBasicMaterial({ color: 0xa99edb })));
const apoI = P.reduce((b, p, i) => (p[2] > P[b][2] ? i : b), 0);
const apoV = V(P[apoI]);
dot(apoV, 4.5, 0x2e1499);
const dropGeo = new THREE.BufferGeometry().setFromPoints([apoV, new THREE.Vector3(apoV.x, ground, apoV.z)]);
const drop = new THREE.Line(dropGeo, new THREE.LineDashedMaterial({ color: 0xa99edb, dashSize: 8, gapSize: 6 })); drop.computeLineDistances(); scene.add(drop);
const endV = V(P[P.length - 1]);
dot(endV, 4, 0xe8590c);
const cur = dot(apoV, 6, 0x2e1499); cur.visible = false;

// labels: HTML on top of the canvas, placed by projecting their 3D anchors each frame
const labels = [];
const label = (text, at, cls, dx = 0, dy = 0) => { const el = document.createElement("div"); el.className = "lab" + (cls ? " " + cls : ""); el.textContent = text; stage.appendChild(el); labels.push({ el, at, dx, dy }); return el; };
label("pad", new THREE.Vector3(0, ground, 0), "", -10, 14);
label(`apogee ≈${Math.round(E.apogee_m / 10) * 10} m`, apoV, "", 10, -6);
label("landing", endV, "", 10, 4);
for (let h = 100; h <= top; h += 100) label(`${h} m`, new THREE.Vector3(-8, h, 0), "tick", -6, 0).classList.add("left");
label("north", new THREE.Vector3((g0x + g1x) / 2, ground, -g1n), "tick", 0, -8);

// camera: from the south-west, a little above, fitted to the whole flight
const box = new THREE.Box3().setFromPoints([...P.map(V), new THREE.Vector3(g0x, ground, -g0n), new THREE.Vector3(g1x, ground, -g1n)]);
const centre = box.getCenter(new THREE.Vector3()); centre.y = (ground + E.apogee_m) * 0.48;
const radius = box.getSize(new THREE.Vector3()).length() / 2;
const dir = new THREE.Vector3(-0.85, 0.42, 1).normalize();
const controls = new OrbitControls(camera, stage);
controls.enablePan = false; controls.enableDamping = false;
controls.enableZoom = false;   // the wheel scrolls the page, as on the camera mount; drag still turns the view
stage.style.touchAction = "pan-y";   // OrbitControls sets none, which stopped a finger scrolling past the figure
controls.minPolarAngle = 0.2; controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.target.copy(centre);
function frame() {
  const fov = THREE.MathUtils.degToRad(camera.fov), fit = radius / Math.sin(Math.min(fov, fov * camera.aspect) / 2) * 0.82;
  camera.position.copy(centre).addScaledVector(dir, fit);
  controls.minDistance = fit * 0.5; controls.maxDistance = fit * 1.6;
  controls.update();
}

function place() {
  const w = stage.clientWidth, h = stage.clientHeight, v = new THREE.Vector3();
  labels.forEach((L) => {
    v.copy(L.at).project(camera);
    const off = v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05;
    L.el.hidden = off;
    if (off) return;
    const x = (v.x + 1) / 2 * w + L.dx, y = (1 - v.y) / 2 * h + L.dy;
    const shift = L.el.classList.contains("left") ? "-100%" : "0";
    L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(${shift}, -50%)`;
  });
}
let queued = false;
function render() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; renderer.render(scene, camera); place(); }); }
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  mats.forEach((m) => m.resolution.set(w, h));
  render();
}
controls.addEventListener("change", render);
new ResizeObserver(resize).observe(stage);
resize(); frame(); render();

// keyboard: left and right turn it, up and down tilt it
stage.addEventListener("keydown", (ev) => {
  const k = { ArrowLeft: [0.18, 0], ArrowRight: [-0.18, 0], ArrowUp: [0, 0.12], ArrowDown: [0, -0.12] }[ev.key];
  if (!k) return;
  ev.preventDefault();
  const off = camera.position.clone().sub(controls.target), s = new THREE.Spherical().setFromVector3(off);
  s.theta += k[0]; s.phi = Math.min(controls.maxPolarAngle, Math.max(controls.minPolarAngle, s.phi - k[1]));
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
  controls.update(); render();
});

// replay: the same clock, speed and words as the plots above
const T0 = -1, T1 = E.land + 1;
const posAt = (t) => {
  if (t <= P[0][4]) return V(P[0]);
  for (let i = 1; i < P.length; i++) if (P[i][4] >= t) { const a = P[i - 1], b = P[i], k = (t - a[4]) / Math.max(1e-6, b[4] - a[4]); return V(a).lerp(V(b), k); }
  return V(P[P.length - 1]);
};
const phase = (t) => t < 0 ? "on the pad" : t < E.burnout ? "boost" : t < E.apogee_t - 0.3 ? "coast" : t < E.apogee_t + 0.6 ? "apogee" : t < E.brownout ? "falling" : t < E.resume ? "board rebooting" : t < E.land ? "falling" : "landed";
function show(t) {
  if (t === null) { cur.visible = false; ro.textContent = ""; render(); return; }
  const p = posAt(Math.max(0, t));
  cur.position.copy(p); cur.visible = true;
  const logged = !(t > E.brownout && t < E.resume);
  ro.textContent = `T${t < 0 ? "−" : "+"}${Math.abs(t).toFixed(1)} s · ${logged ? Math.round(p.y) + " m" : "not logged"} · ${phase(t)}`;
  render();
}
// Replay reads Stop while it plays; pressing it again stops the flight where it is.
const rb = document.getElementById("replay");
let playing = false, raf = 0, hideTimer = 0;
function stopReplay() { if (raf) cancelAnimationFrame(raf); raf = 0; playing = false; rb.textContent = "Replay the flight"; }
rb.addEventListener("click", () => {
  if (playing) { stopReplay(); return; }
  if (still) { show(E.apogee_t); return; }
  clearTimeout(hideTimer); playing = true; rb.textContent = "Stop"; let t = T0, last = 0;
  const step = (now) => { const dt = last ? (now - last) / 1000 : 0; last = now; t += dt * 4; show(Math.min(t, T1));
    if (t < T1) raf = requestAnimationFrame(step); else { stopReplay(); hideTimer = setTimeout(() => show(null), 1500); } };
  raf = requestAnimationFrame(step);
});
</script>
</body>
</html>
